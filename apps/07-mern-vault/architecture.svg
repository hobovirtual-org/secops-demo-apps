<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="vault-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="k8s-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#326ce5"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#4ade80"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#c084fc"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="920" height="540" fill="url(#bg-grad)" rx="16"/>

  <!-- Header Section -->
  <text x="40" y="45" fill="#f8fafc" font-family="-apple-system, system-ui, sans-serif" font-size="20" font-weight="700">MERN Stack on Amazon EKS + HashiCorp Vault</text>
  <text x="40" y="68" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="13">Zero Static Secrets • Dynamic Kubernetes Auth • Vault Agent Sidecar Injection</text>

  <!-- AWS EKS Boundary Box -->
  <rect x="30" y="95" width="570" height="415" rx="12" fill="#0f172a" fill-opacity="0.6" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="45" y="85" width="165" height="22" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
  <text x="55" y="100" fill="#60a5fa" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600">Amazon EKS Cluster (v1.32)</text>

  <!-- Pod 1: Frontend -->
  <g filter="url(#shadow)">
    <rect x="50" y="130" width="220" height="110" rx="10" fill="url(#card-grad)" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="50" y="130" width="220" height="28" rx="10" fill="#0369a1" fill-opacity="0.3"/>
    <circle cx="68" cy="144" r="5" fill="#38bdf8"/>
    <text x="80" y="148" fill="#f0f9ff" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="700">Frontend Pod (React 19)</text>
    <text x="65" y="175" fill="#cbd5e1" font-family="-apple-system, system-ui, sans-serif" font-size="11">Image: <tspan fill="#38bdf8">ubi9/nodejs-20-minimal</tspan></text>
    <text x="65" y="195" fill="#cbd5e1" font-family="-apple-system, system-ui, sans-serif" font-size="11">Service: <tspan fill="#f59e0b">LoadBalancer (:80)</tspan></text>
    <text x="65" y="215" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="10">Static Web UI + Status API Proxy</text>
  </g>

  <!-- Pod 2: Backend & Vault Agent -->
  <g filter="url(#shadow)">
    <rect x="50" y="280" width="260" height="210" rx="10" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="50" y="280" width="260" height="28" rx="10" fill="#0284c7" fill-opacity="0.3"/>
    <circle cx="68" cy="294" r="5" fill="#4ade80"/>
    <text x="80" y="298" fill="#f0f9ff" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="700">Backend Pod (mern-backend)</text>

    <!-- App container -->
    <rect x="65" y="320" width="230" height="50" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="75" y="338" fill="#e2e8f0" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600">Container: Express App (:3001)</text>
    <text x="75" y="355" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="10">Reads /vault/secrets/config.json</text>

    <!-- Injected Volume -->
    <rect x="65" y="380" width="230" height="35" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <text x="75" y="398" fill="#a7f3d0" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="600">📁 Shared emptyDir: /vault/secrets</text>
    <text x="75" y="410" fill="#6ee7b7" font-family="-apple-system, system-ui, sans-serif" font-size="9">config.json (mongo_user, mongo_pass)</text>

    <!-- Sidecar container -->
    <rect x="65" y="425" width="230" height="50" rx="6" fill="#1e293b" stroke="#7c3aed" stroke-width="1"/>
    <text x="75" y="443" fill="#e9d5ff" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600">Sidecar: vault-agent</text>
    <text x="75" y="460" fill="#c084fc" font-family="-apple-system, system-ui, sans-serif" font-size="10">Auto-renews lease & token</text>
  </g>

  <!-- Pod 3: MongoDB StatefulSet -->
  <g filter="url(#shadow)">
    <rect x="360" y="280" width="220" height="150" rx="10" fill="url(#card-grad)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="360" y="280" width="220" height="28" rx="10" fill="#059669" fill-opacity="0.3"/>
    <circle cx="378" cy="294" r="5" fill="#10b981"/>
    <text x="390" y="298" fill="#f0f9ff" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="700">MongoDB (StatefulSet)</text>
    <text x="375" y="325" fill="#cbd5e1" font-family="-apple-system, system-ui, sans-serif" font-size="11">Service: <tspan fill="#34d399">ClusterIP / Headless</tspan></text>
    <text x="375" y="345" fill="#cbd5e1" font-family="-apple-system, system-ui, sans-serif" font-size="11">Port: <tspan fill="#f59e0b">27017</tspan></text>
    <text x="375" y="368" fill="#cbd5e1" font-family="-apple-system, system-ui, sans-serif" font-size="11">Storage: <tspan fill="#94a3b8">emptyDir Volume</tspan></text>
    <text x="375" y="390" fill="#a7f3d0" font-family="-apple-system, system-ui, sans-serif" font-size="10">Protected DB Credentials</text>
  </g>

  <!-- Flow Arrows inside Cluster -->
  <!-- Frontend to Backend -->
  <path d="M 160 240 L 160 270" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
  <text x="170" y="260" fill="#38bdf8" font-family="-apple-system, system-ui, sans-serif" font-size="10">HTTP Proxy (:3001)</text>

  <!-- Backend to MongoDB -->
  <path d="M 310 345 L 350 345" stroke="#4ade80" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
  <text x="315" y="338" fill="#4ade80" font-family="-apple-system, system-ui, sans-serif" font-size="10">MongoDB Wire</text>

  <!-- HashiCorp Vault Server Box -->
  <g filter="url(#shadow)">
    <rect x="640" y="130" width="250" height="360" rx="12" fill="#0f172a" stroke="#0284c7" stroke-width="2"/>
    <rect x="640" y="130" width="250" height="36" rx="12" fill="url(#vault-grad)"/>
    <text x="660" y="153" fill="#ffffff" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="700">HashiCorp Vault Server</text>
    <text x="660" y="185" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="11">Self-Managed / HCP Vault Dedicated</text>

    <!-- Component 1: Kubernetes Auth -->
    <rect x="655" y="205" width="220" height="85" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="668" y="225" fill="#60a5fa" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="700">Kubernetes Auth Engine</text>
    <text x="668" y="245" fill="#cbd5e1" font-family="-apple-system, system-ui, sans-serif" font-size="10">Path: <tspan fill="#38bdf8">auth/kubernetes/mern-vault</tspan></text>
    <text x="668" y="262" fill="#cbd5e1" font-family="-apple-system, system-ui, sans-serif" font-size="10">Issuer: <tspan fill="#f59e0b">EKS OIDC Provider</tspan></text>
    <text x="668" y="278" fill="#cbd5e1" font-family="-apple-system, system-ui, sans-serif" font-size="10">Role: <tspan fill="#4ade80">mern-backend</tspan></text>

    <!-- Component 2: KV Secret Engine -->
    <rect x="655" y="305" width="220" height="75" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
    <text x="668" y="325" fill="#34d399" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="700">KV v2 Secrets Engine</text>
    <text x="668" y="345" fill="#cbd5e1" font-family="-apple-system, system-ui, sans-serif" font-size="10">Mount: <tspan fill="#38bdf8">apps/mern-vault</tspan></text>
    <text x="668" y="363" fill="#cbd5e1" font-family="-apple-system, system-ui, sans-serif" font-size="10">Secret: <tspan fill="#f59e0b">data/mongodb</tspan></text>

    <!-- Security Notice -->
    <rect x="655" y="395" width="220" height="80" rx="8" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1"/>
    <text x="668" y="415" fill="#c084fc" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700">Security Invariant</text>
    <text x="668" y="433" fill="#e9d5ff" font-family="-apple-system, system-ui, sans-serif" font-size="10">• Ephemeral 1-hour tokens</text>
    <text x="668" y="450" fill="#e9d5ff" font-family="-apple-system, system-ui, sans-serif" font-size="10">• Zero hardcoded passwords</text>
    <text x="668" y="466" fill="#e9d5ff" font-family="-apple-system, system-ui, sans-serif" font-size="10">• RBAC TokenReview verified</text>
  </g>

  <!-- Auth flow line from Sidecar to Vault Auth -->
  <path d="M 295 440 C 470 440, 480 250, 645 250" stroke="#c084fc" stroke-width="2" stroke-dasharray="4 3" fill="none" marker-end="url(#arrow-purple)"/>
  <rect x="420" y="300" width="160" height="24" rx="4" fill="#1e293b" stroke="#7c3aed" stroke-width="1"/>
  <text x="426" y="316" fill="#c084fc" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="600">1. JWT ServiceAccount Login</text>

  <!-- Secret delivery flow line from KV to Volume -->
  <path d="M 645 345 C 500 345, 450 395, 305 395" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 3" fill="none" marker-end="url(#arrow-blue)"/>
  <rect x="420" y="365" width="160" height="24" rx="4" fill="#1e293b" stroke="#0284c7" stroke-width="1"/>
  <text x="428" y="381" fill="#38bdf8" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="600">2. Renders Secret Template</text>
</svg>
