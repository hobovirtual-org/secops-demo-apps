name: app-08 — Build & Push Agent Image

on:
  push:
    branches: [main]
    paths:
      - "apps/08-vault-agentic-auth/app/agent/**"
      - "apps/08-vault-agentic-auth/terraform/**"
  workflow_dispatch: {}

env:
  AWS_REGION: us-east-1
  ECR_REPO: demo-app08-dev-agent

permissions:
  id-token: write   # required for OIDC token request
  contents: read

jobs:
  build-and-push:
    name: Build & push to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC — no static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GH_ACTIONS_ECR_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE_URI="${REGISTRY}/${ECR_REPO}:${{ github.sha }}"
          IMAGE_LATEST="${REGISTRY}/${ECR_REPO}:latest"

          docker build \
            --tag "${IMAGE_URI}" \
            --tag "${IMAGE_LATEST}" \
            apps/08-vault-agentic-auth/app/agent/

          docker push "${IMAGE_URI}"
          docker push "${IMAGE_LATEST}"

          echo "IMAGE_URI=${IMAGE_URI}" >> "${GITHUB_ENV}"
          echo "Built and pushed: ${IMAGE_URI}"

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster demo-app08-dev-cluster \
            --service demo-app08-dev-agent-svc \
            --force-new-deployment \
            --query "service.deployments[0].{status:status,desired:desiredCount}" \
            --output table
